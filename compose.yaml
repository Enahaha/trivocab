name: trivocab

services:
  mysql:
    image: mysql:8.4
    container_name: trivocab-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: trivocab
      MYSQL_USER: trivocab
      MYSQL_PASSWORD: trivocab
      MYSQL_ROOT_PASSWORD: trivocab
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - trivocab-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data-h2.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utrivocab -ptrivocab --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  trivocab-mysql-data:
    name: trivocab-mysql-data
